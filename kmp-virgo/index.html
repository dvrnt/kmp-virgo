<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Infografik interaktif rekam jejak AIS KMP Virgo Transport 8 dari Jepang, Batam, hingga layanan Surabaya–Banjarmasin.">
  <title>Rekam Jejak KMP Virgo Transport 8 di Indonesia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    @font-face { font-family: "Lora"; src: url("assets/Lora-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "PT Sans"; src: url("assets/PTSans-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "PT Sans"; src: url("assets/PTSans-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

    :root {
      --infographic-max-width: 720px;
      --infographic-margin: clamp(16px, 3vw, 25px);
      --section-gap: clamp(16px, 3vw, 24px);
      --size-title: clamp(22px, calc(20.24px + 0.490vw), 24px);
      --size-subheader: clamp(20px, calc(18.24px + 0.490vw), 22px);
      --size-body: clamp(17px, calc(16.12px + 0.245vw), 18px);
      --size-chart-text: clamp(17px, calc(16.12px + 0.245vw), 18px);
      --size-footer: clamp(15px, calc(14.12px + 0.245vw), 16px);
      --size-note: clamp(13px, calc(12.5px + 0.245vw), 14px);
      --size-legend: clamp(13px, calc(12.5px + 0.245vw), 14px);
      --ink: #172735;
      --muted: #526674;
      --ocean: #eef6fa;
      --land: #dce7df;
      --coast: #b6c8c0;
      --blue: #00599b;
      --blue-light: #99bdd7;
      --red: #ae091a;
      --pink: #df9ea4;
      --yellow: #f3c728;
      --yellow-light: #fbe9a9;
      --green: #168354;
      --green-light: #aee3c9;
      --paper: #ffffff;
      --line: #d8e1e6;
    }

    html { box-sizing: border-box; background: #f2f5f6; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; width: 100%; overflow-x: hidden; color: var(--ink); background: var(--paper); font-family: "PT Sans", Arial, sans-serif; }
    button, input { font: inherit; }
    .infographic { width: min(100%, var(--infographic-max-width)); margin-inline: auto; padding: var(--infographic-margin); background: var(--paper); }
    .infographic > * + * { margin-block-start: var(--section-gap); }
    .title { margin: 0; font-family: "Lora", Georgia, serif; font-size: var(--size-title); line-height: 1.18; font-weight: 700; }

    .chart { margin: 0; font-size: var(--size-chart-text); }
    .chart > * + * { margin-block-start: var(--section-gap); }

    .map-card { position: relative; overflow: hidden; border: 1px solid #d4e0e1; border-radius: 12px; background: var(--ocean); box-shadow: 0 10px 28px rgba(32, 61, 78, 0.07); }
    .map-card--journey { border-color: #b8d7ca; box-shadow: 0 14px 32px rgba(22, 131, 84, 0.11); }
    .leaflet-map { width: 100%; background: var(--ocean); }
    .map-main { height: clamp(400px, 72vw, 570px); }
    .route-switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: white; }
    .route-switch__button { min-width: 0; padding: 9px 10px; border: 1px solid #9ec0d8; border-radius: 7px; color: var(--blue); background: white; font-size: var(--size-footer); font-weight: 700; line-height: 1.2; cursor: pointer; }
    .route-switch__label, .route-switch__date { display: block; }
    .route-switch__date { margin-top: 3px; font-size: 0.9em; font-weight: 400; }
    .route-switch__button[aria-pressed="true"] { border-color: var(--blue); color: white; background: var(--blue); }
    .route-switch__button:hover, .route-switch__button:focus-visible { outline: 3px solid rgba(0, 89, 155, 0.2); outline-offset: 2px; }
    .leaflet-container { font-family: "PT Sans", Arial, sans-serif; }
    .leaflet-control-zoom a { color: var(--ink); }
    .leaflet-control-attribution { font-size: 10px; }
    .map-label { padding: 2px 5px; border: 0; border-radius: 3px; background: rgba(255, 255, 255, 0.9); box-shadow: 0 1px 3px rgba(23, 39, 53, 0.22); color: var(--ink); font-family: "PT Sans", Arial, sans-serif; font-size: 15px; font-weight: 700; white-space: nowrap; }
    .map-label::before { display: none; }
    .latest-pin { width: 18px !important; height: 18px !important; border: 3px solid var(--red); border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 4px rgba(243, 199, 40, 0.35); }
    .ship-marker { width: 30px !important; height: 30px !important; margin: 0 !important; border: 0 !important; background: transparent !important; }
    .ship-marker svg { display: block; width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgba(23, 39, 53, 0.45)); transform-origin: center; }

    .map-caption { margin: 0; padding: 10px 16px 12px; border-top: 1px solid var(--line); background: white; color: var(--muted); font-size: var(--size-note); line-height: 1.38; }

    .playback { padding: 12px 16px 14px; border-top: 1px solid var(--line); background: white; }
    .playback__row { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
    .play-button { width: 46px; height: 46px; border: 0; border-radius: 50%; color: white; background: var(--green); font-weight: 700; cursor: pointer; }
    .play-button:hover, .play-button:focus-visible { outline: 3px solid rgba(52, 185, 119, 0.24); outline-offset: 2px; }
    .route-range { width: 100%; accent-color: var(--green); cursor: pointer; }
    .playback__output { margin: 8px 0 0; color: var(--muted); font-size: var(--size-footer); line-height: 1.35; }
    .playback__output strong { color: var(--ink); }
    .playback__footer { display: flex; align-items: end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .speed-control { display: inline-flex; overflow: hidden; border: 1px solid #9bcdb7; border-radius: 6px; }
    .speed-control button { min-width: 38px; padding: 5px 7px; border: 0; border-right: 1px solid #9bcdb7; color: var(--green); background: white; font-size: var(--size-footer); font-weight: 700; cursor: pointer; }
    .speed-control button:last-child { border-right: 0; }
    .speed-control button[aria-pressed="true"] { color: white; background: var(--green); }

    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: var(--size-legend); }
    .legend li { display: inline-flex; align-items: center; gap: 7px; }
    .legend__line { width: 20px; height: 0; border-top: 3px solid; border-radius: 4px; }
    .legend__line--blue { border-color: var(--blue); }
    .legend__line--red { border-color: var(--red); }
    .legend__line--green { border-color: var(--green); }
    .legend__dot { width: 10px; height: 10px; border: 2px solid var(--red); border-radius: 50%; background: var(--yellow); }

    .footer { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 0.5em 1em; padding-top: 14px; border-top: 1px solid var(--line); font-family: "PT Sans", Arial, sans-serif; font-size: var(--size-footer); font-weight: 400; line-height: 1.4; color: var(--muted); }
    .footer__text { min-width: 0; flex: 1 1 28rem; }
    .footer__logo { display: block; block-size: 1.5em; inline-size: auto; flex: 0 0 auto; margin-left: auto; }

    @media (max-width: 479px) {
      .map-card { border-radius: 10px; }
      .map-caption, .playback { padding-inline: 12px; }
      .map-main { height: 390px; }
      .route-switch { padding-inline: 12px; }
      .legend { display: grid; grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    @media print {
      html { background: white; }
      .playback { display: none; }
      .map-card { break-inside: avoid; box-shadow: none; }
    }
  </style>
</head>

  }

  function stopPlayback() {
    if (timer) window.clearInterval(timer);
    timer = null;
    playButton.textContent = "▶";
    playButton.setAttribute("aria-label", "Putar animasi rute");
    playButton.setAttribute("aria-pressed", "false");
  }

  function startPlayback() {
    stopPlayback();
    playButton.textContent = "Ⅱ";
    playButton.setAttribute("aria-label", "Jeda animasi rute");
    playButton.setAttribute("aria-pressed", "true");
    const profile = speedProfiles[playbackSpeed];
    timer = window.setInterval(() => {
      const next = Number(range.value) + profile.step;
      range.value = next > Number(range.max) ? 0 : next;
      renderPlayback(Number(range.value));
    }, profile.interval);
  }

  function setPlaybackSpeed(speed) {
    const wasPlaying = Boolean(timer);
    playbackSpeed = speed;
    speedButtons.forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.speed) === speed)));
    if (wasPlaying) startPlayback();
  }

  function selectRoute(route) {
    stopPlayback();
    if (activeRoute) journeyMap.removeLayer(routeConfig[activeRoute].layer);
    activeRoute = route;
    journeyMap.addLayer(routeConfig[route].layer);
    routeButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.route === route)));
    operationPlayback.hidden = route !== "operation";
    mapCaption.textContent = routeConfig[route].caption;
    if (route === "operation") renderPlayback(Number(range.value));
    window.requestAnimationFrame(() => {
      journeyMap.invalidateSize();
      journeyMap.fitBounds(routeConfig[route].bounds, { padding: [24, 24], animate: !reducedMotion });
    });
  }

  range.addEventListener("input", () => {
    stopPlayback();
    renderPlayback(Number(range.value));
  });
  playButton.addEventListener("click", () => timer ? stopPlayback() : startPlayback());
  speedButtons.forEach((button) => button.addEventListener("click", () => setPlaybackSpeed(Number(button.dataset.speed))));
  routeButtons.forEach((button) => button.addEventListener("click", () => selectRoute(button.dataset.route)));
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopPlayback(); });
  selectRoute("delivery");
</script>
</body>
</html>
